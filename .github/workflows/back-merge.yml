name: Back-merge

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: back-merge
  cancel-in-progress: false

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: develop
          fetch-depth: 0

      - name: Bring develop up to date with main
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop already has everything on main."
            exit 0
          fi

          before=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
            found=$(echo "$prs" | jq length)
            [ "$found" -gt 0 ] && break
            sleep 10
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::GitHub links no PR to $GITHUB_SHA, so this is treated as a direct push and main is merged into develop."
          fi
          released=$(echo "$prs" | jq -r '[.[] | select(.base.ref == "main" and .head.ref == "develop" and .merged_at != null)][0].head.sha // empty')

          if [ -n "$released" ]; then
            echo "This push is release PR head $released, squashed or rebased onto main as $GITHUB_SHA."
            if ! git merge-base --is-ancestor "$released" HEAD; then
              echo "::error::develop no longer contains the release PR's last commit $released. Put develop back on main by hand."
              exit 1
            fi
            if ! git diff --quiet "$released" "$GITHUB_SHA"; then
              echo "::error::main at $GITHUB_SHA does not hold the same files as the release PR's last commit $released. Check main and put develop back on main by hand."
              exit 1
            fi
            if ! git rebase --onto "$GITHUB_SHA" "$released" HEAD; then
              git rebase --abort
              echo "::error::Commits merged into develop after the release do not apply onto main. Put them on top of main by hand: git checkout develop && git pull && git rebase --onto $GITHUB_SHA $released"
              exit 1
            fi
            echo "Commits kept on top of main:"
            git log --oneline "$GITHUB_SHA..HEAD"
            if ! git push --force-with-lease="refs/heads/develop:$before" origin HEAD:develop; then
              echo "::error::develop changed while this ran, or the push was refused. Rerun this workflow."
              exit 1
            fi
            exit 0
          fi

          if git log --format=%s HEAD..origin/main | grep '^Revert "'; then
            echo "::error::main holds a revert. Merging it would undo that work on develop too. Merge main into develop by hand and decide what to keep: git checkout develop && git pull && git merge origin/main"
            exit 1
          fi
          if ! git merge --no-ff -m "Merge branch 'main' into develop" origin/main; then
            git merge --abort
            echo "::error::main does not merge into develop cleanly. Merge it by hand: git checkout develop && git pull && git merge origin/main"
            exit 1
          fi
          if ! git push origin HEAD:develop; then
            echo "::error::The merge worked but the push to develop was refused. Merge it by hand: git checkout develop && git pull && git merge origin/main && git push"
            exit 1
          fi
