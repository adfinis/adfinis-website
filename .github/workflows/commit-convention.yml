name: Commit Convention

on:
  pull_request:
    branches:
      - develop
    types: [opened, edited, synchronize, reopened]

jobs:
  commit-convention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: 'nextjs/.nvmrc'

      - name: Test the release scripts
        run: node --test .github/scripts/*.test.mjs

      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/commit-convention.mjs --message "$TITLE"

      - name: Check every commit in the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/commit-convention.mjs --range "$BASE..$HEAD"
