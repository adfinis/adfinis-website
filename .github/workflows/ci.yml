name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop

jobs:
  nextjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: 'nextjs/.nvmrc'

      - name: Install dependencies
        run: cd ./nextjs && npm install

      - name: Run Vitest tests
        run: cd ./nextjs && npm run test --coverage

      - name: Build NextJS
        run: cd ./nextjs && npm run build

  nextjs-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: 'nextjs/.nvmrc'

      - name: Install dependencies
        run: cd ./nextjs && npm install

      - name: Install Chromium for Playwright
        run: cd ./nextjs && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: cd ./nextjs && npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: nextjs/playwright-report/


  strapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: 'strapi/.nvmrc'

      - name: Install dependencies
        run: cd ./strapi && npm install

      - name: Build Strapi Application
        run: cd ./strapi && npm run build
